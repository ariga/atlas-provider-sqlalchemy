name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version to publish, e.g. "0.1.2"
        required: false
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.14'
      - name: Install poetry
        uses: abatilo/actions-poetry@a5643c67b5fcc9ac5eddb395c7f61b1b66d86034 # v2
      - name: Set version env
        id: set_version
        ## if version is not provided as input, use the tag name
        run: |
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          if [ -z "${{ github.event.inputs.version }}" ]; then
              echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Set the package version
        env:
          RELEASE_VERSION: ${{ steps.set_version.outputs.tag }}
        run: |
          poetry version $RELEASE_VERSION
      - name: Build the package
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
